version: 2

models:
  - name: int_customer_orders
    description: "Customer-level order aggregates built from orders and payments."
    config:
      access: protected
    columns:
      - name: customer_id
        description: "Customer identifier at the grain of the model."
        tests:
          - not_null
          - unique
      - name: number_of_orders
        description: "Count of orders placed by the customer."
      - name: total_lifetime_value
        description: "Sum of successful payment amounts across the customer's orders."
      - name: first_order_date
        description: "Date of the customer's first order."
        tests:
          - not_null
      - name: most_recent_order_date
        description: "Date of the customer's most recent order."
        tests:
          - not_null

  - name: int_order_items_enriched
    description: "Order item facts enriched with order context and product attributes for product-level analysis."
    config:
      access: protected
    semantic_model:
      enabled: true
    agg_time_dimension: order_date
    metrics:
      - name: distinct_products_sold
        label: "Distinct Products Sold"
        description: "Count of distinct products that appeared on order items in scope."
        type: simple
        agg: count_distinct
        expr: product_id

      - name: units_sold
        label: "Units Sold"
        description: "Total quantity sold across order items in scope."
        type: simple
        agg: sum
        expr: quantity

      - name: product_revenue
        label: "Product Revenue (USD)"
        description: "Revenue generated by order items in scope, based on line_total."
        type: simple
        agg: sum
        expr: line_total
    columns:
      - name: order_item_id
        description: "Unique order item identifier."
        entity:
          name: order_item
          type: primary
        tests:
          - not_null
          - unique
      - name: order_id
        description: "Foreign key to stg_orders."
        entity:
          name: order
          type: foreign
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: order_date
        description: "Date the parent order was placed."
        granularity: day
        dimension:
          type: time
        tests:
          - not_null
      - name: status
        description: "Lowercased order status from the parent order."
        dimension:
          type: categorical
        tests:
          - accepted_values:
              arguments:
                values: ['placed', 'shipped', 'completed', 'returned']
      - name: customer_id
        description: "Customer who placed the parent order."
        entity:
          name: customer
          type: foreign
      - name: product_id
        description: "Foreign key to stg_products."
        entity:
          name: product
          type: foreign
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: product_name
        description: "Product name from the product catalog."
        dimension:
          type: categorical
      - name: category
        description: "Lowercased product category."
        dimension:
          type: categorical
      - name: quantity
        description: "Number of units on the order item."
        tests:
          - not_null
      - name: unit_price
        description: "Unit price captured on the order item."
      - name: line_total
        description: "Revenue for the order item: quantity * unit_price."

